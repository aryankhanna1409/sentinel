<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c79a46"/><stop offset=".5" stop-color="#9a6b1f"/><stop offset="1" stop-color="#6b4513"/></linearGradient>
