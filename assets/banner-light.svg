<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="100%" role="img" aria-label="sentinel: Search-and-rescue vision: a YOLO11 scanner that finds people who are hidden or in the dark, across RGB, near-infrared and thermal views."><defs>
